spring.application.name=catalog

# Toda la configuración que cambia entre entornos viene de variables de entorno.
# Las disponibles están documentadas en .env.example. Ninguna contraseña va en este archivo.

# ==========================================
# 1. Servidor
# ==========================================
server.port=${SERVER_PORT:8082}

# HTTPS apagado por defecto. Se activa con SSL_ENABLED=true y un keystore propio.
server.ssl.enabled=${SSL_ENABLED:false}
server.ssl.key-store=${SSL_KEYSTORE_PATH:}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:}
server.ssl.key-store-type=PKCS12

# ==========================================
# 2. Base de datos (MySQL)
# ==========================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/catalog?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:catalog}
spring.datasource.password=${DB_PASSWORD}

# ==========================================
# 3. JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# 4. Otros servicios
# ==========================================
# Convención de puertos: el servicio del módulo N de la consigna escucha en 808N.
api.usuarios.url=${USERS_VALIDATE_URL:http://localhost:8081/usuarios/validar}
api.inventario.url=${INVENTORY_STOCK_URL:http://localhost:8083/stock/}
api.resenas.url=${REVIEWS_RATING_URL:http://localhost:8087/reviews/rating/}
